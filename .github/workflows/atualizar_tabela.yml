name: 🔄 Atualizar Tabela de Preços

on:
  push:
    paths:
      - 'tabela_precos.xlsx'   # Dispara quando o xlsx for enviado ao repositório
  workflow_dispatch:            # Permite rodar manualmente pelo GitHub

jobs:
  atualizar-dados:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Baixar repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Instalar dependências
        run: pip install pandas openpyxl

      - name: ⚙️ Processar planilha e atualizar arquivos
        run: python processar_planilha.py

      - name: 🚀 Publicar alterações no GitHub Pages
        run: |
          git config --global user.name  "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add script.js index.html README.md
          git diff --quiet && git diff --staged --quiet \
            || git commit -m "🤖 Tabela atualizada automaticamente" \
            && git push
